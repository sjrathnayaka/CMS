spring.application.name=cms
server.port=8080

spring.datasource.url= jdbc:postgresql://localhost:5432/cms_db
spring.datasource.username= postgres
spring.datasource.password= root
spring.datasource.driver-class-name= org.postgresql.Driver
spring.session.jdbc.initialize-schema=always

# SQL initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.continue-on-error=false

# Card Number Encryption Settings (AES-256)
# IMPORTANT: Change these values in production!
# Secret key must be a strong password
# Salt must be a hex-encoded string (use online generator)
encryption.secret-key=MySecureCardEncryptionKey2026!
encryption.salt=deadbeefdeadbeefdeadbeefdeadbeef

# Categorized Logging Configuration
# These levels are captured by specific appenders in logback-spring.xml
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=TRACE
